[project]
name = "coffeecompass-backend"
version = "0.1.0"
description = "RAG-powered coffee shop finder backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "openai>=1.55",
    "structlog>=24.4",
    "rapidfuzz>=3.10",
    "tenacity>=9.0",
    "python-dateutil>=2.9",
    "click>=8.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.7",
]
eval = [
    "ragas>=0.1.0",
    "datasets>=2.14.0",
]
agent = [
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "sse-starlette>=2.1",
    # zep-cloud is intentionally omitted: the User-scoped Preference Summary is
    # deferred behind the Memory protocol (see ADR-0002 / card 11). Add it then.
]

[tool.uv]
# Install all tooling groups by default so `uv sync` / `uv run` never silently
# drops one (e.g. eval) when another (agent) is requested.
default-groups = ["dev", "eval", "agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
