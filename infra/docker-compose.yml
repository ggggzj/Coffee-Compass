services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: coffeecompass-postgres
    environment:
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: coffee
      POSTGRES_DB: coffeecompass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee -d coffeecompass"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
